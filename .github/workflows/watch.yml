name: watch-wedding-slots

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum for cron)
  workflow_dispatch:
    inputs:
      force_test:
        description: "Send a TEST heartbeat message now (to the primary recipient)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check slots and notify
        env:
          WATCH_DATE:     "04-09-2026"
          WATCH_FROM:     "12:30"
          HEARTBEAT_HOURS: "1"
          FAIL_THRESHOLD:  "3"
          FORCE_TEST: ${{ github.event.inputs.force_test }}
          CALLMEBOT_RECIPIENTS: ${{ secrets.CALLMEBOT_RECIPIENTS }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS:    ${{ secrets.TELEGRAM_CHAT_IDS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO:  ${{ secrets.EMAIL_TO }}
        run: python3 check_once.py

      - name: Persist state (dedup + heartbeat + failure)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "slot-bot"
            git config user.email "slot-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update slot state [skip ci]"
            git push
          else
            echo "no state change"
          fi
