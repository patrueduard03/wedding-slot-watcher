name: watch-wedding-slots

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum for cron)
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

# needed so the job can commit state.json back to the repo
permissions:
  contents: write

# never run two checks at once
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check slots and notify
        env:
          WATCH_DATE: "04-09-2026"
          WATCH_FROM: "12:30"
          CALLMEBOT_RECIPIENTS: ${{ secrets.CALLMEBOT_RECIPIENTS }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS:    ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python3 check_once.py

      - name: Persist dedup state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "slot-bot"
            git config user.email "slot-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update slot state [skip ci]"
            git push
          else
            echo "no state change"
          fi
